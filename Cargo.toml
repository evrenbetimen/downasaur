[workspace]
resolver = "3"
members = ["crates/downasaur-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/evrenbetimen/downasaur"
authors = ["Downasaur contributors"]

[workspace.dependencies]
downasaur-core = { path = "crates/downasaur-core" }

# Async runtime and I/O
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"

# Networking
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream", "cookies", "gzip", "brotli", "zstd", "socks"] }
url = { version = "2.5", features = ["serde"] }
m3u8-rs = "6"

# Persistence
rusqlite = { version = "0.40", features = ["bundled", "chrono", "fallible_uint"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1.13"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.27", features = ["v4", "serde"] }
directories = "6"
fastrand = "2"
parking_lot = "0.12"
unicode-normalization = "0.1"
deunicode = "1.6"

# Tauri (v2)
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
